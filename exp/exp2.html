<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Pilihan Ganda Interaktif</title>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8f9fa;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2b2b2b;
    }
    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    .question {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 15px;
      padding: 15px 20px;
    }
    .question h3 {
      margin-top: 0;
      font-size: 16px;
    }
    .options label {
      display: block;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .options input {
      margin-right: 8px;
    }
    #output {
      max-width: 800px;
      margin: 0 auto;
    }
    #submit-btn {
      display: block;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      margin: 20px auto;
      cursor: pointer;
      font-size: 16px;
    }
    #submit-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Ujian Pilihan Ganda Interaktif</h1>

  <div class="upload-box">
    <input type="file" id="upload" accept=".docx">
    <p>Pilih file Word (.docx) berisi soal pilihan ganda (A–D)</p>
  </div>

  <div id="output"></div>

  <button id="submit-btn" style="display:none;">Kirim Jawaban</button>

  <script>
    document.getElementById("upload").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        const arrayBuffer = e.target.result;

        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
          .then(function(result) {
            const text = result.value
              .replace(/<\/?[^>]+(>|$)/g, "") // hapus tag HTML
              .replace(/\n+/g, "\n")          // bersihkan newline
              .trim();

            tampilkanSoal(text);
          })
          .catch(function(err) {
            alert("Gagal membaca file: " + err.message);
            console.error(err);
          });
      };

      reader.readAsArrayBuffer(file);
    });

    function tampilkanSoal(text) {
      const output = document.getElementById("output");
      output.innerHTML = "";

      // Pisahkan soal berdasarkan nomor (1., 2., dst)
      const soalArray = text.split(/\n?\d+\.\s+/).filter(s => s.trim() !== "");

      soalArray.forEach((soalText, index) => {
        // Pisahkan pertanyaan dan opsi (A–D)
        const bagian = soalText.split(/\n/).filter(l => l.trim() !== "");
        const pertanyaan = bagian[0];
        const opsi = bagian.slice(1);

        const qDiv = document.createElement("div");
        qDiv.className = "question";
        qDiv.innerHTML = `<h3>${index + 1}. ${pertanyaan}</h3>`;

        const opsiDiv = document.createElement("div");
        opsiDiv.className = "options";

        opsi.forEach((line, i) => {
          const match = line.match(/^[A-D]\.\s*(.*)$/i);
          if (match) {
            const label = document.createElement("label");
            label.innerHTML = `<input type="radio" name="q${index}" value="${match[1]}"> ${line}`;
            opsiDiv.appendChild(label);
          }
        });

        qDiv.appendChild(opsiDiv);
        output.appendChild(qDiv);
      });

      document.getElementById("submit-btn").style.display = "block";
    }

    document.getElementById("submit-btn").addEventListener("click", () => {
      const answers = {};
      document.querySelectorAll(".question").forEach((q, i) => {
        const selected = q.querySelector("input:checked");
        answers[`Soal ${i + 1}`] = selected ? selected.value : "(Belum dijawab)";
      });

      console.log("Jawaban:", answers);
      alert("Jawaban telah dikumpulkan! (Cek console untuk detail)");
    });
  </script>

</body>
</html>
