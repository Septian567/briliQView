<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konversi Word ke Web</title>

  <!-- Library Mammoth.js -->
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .uploader {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 0 auto 20px;
      text-align: center;
    }
    #output {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h1>Konversi Dokumen Word ke Tampilan Web</h1>

  <div class="uploader">
    <input type="file" id="upload" accept=".docx" />
    <p>Pilih file Word (.docx) untuk dikonversi menjadi tampilan HTML.</p>
  </div>

  <div id="output">
    <h2>Hasil Konversi:</h2>
    <div id="preview"></div>
  </div>

  <script>
    document.getElementById("upload").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        const arrayBuffer = e.target.result;

        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
          .then(function(result) {
            document.getElementById("preview").innerHTML = result.value;
          })
          .catch(function(err) {
            document.getElementById("preview").innerHTML = "<p style='color:red;'>Gagal mengonversi file.</p>";
            console.error(err);
          });
      };

      reader.readAsArrayBuffer(file);
    });
  </script>

</body>
</html>
