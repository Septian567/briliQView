<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis dari Word</title>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .uploader {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 0 auto 20px;
      text-align: center;
    }
    #output {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
    }
    .question {
      margin-bottom: 25px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
    .option {
      display: block;
      margin-left: 20px;
      cursor: pointer;
      padding: 5px;
      border-radius: 6px;
    }
    .option:hover {
      background-color: #eef;
    }
    input[type="radio"] {
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <h1>Konversi File Ujian (Word) ke Kuis Interaktif</h1>

  <div class="uploader">
    <input type="file" id="upload" accept=".docx" />
    <p>Unggah file Word (.docx) berisi soal pilihan ganda A–D.</p>
  </div>

  <div id="output">
    <h2>Hasil Konversi:</h2>
    <div id="preview"></div>
  </div>

  <script>
    document.getElementById("upload").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        const arrayBuffer = e.target.result;

        mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
          .then(function(result) {
            let html = result.value;
            html = formatQuestions(html);
            document.getElementById("preview").innerHTML = html;
          })
          .catch(function(err) {
            document.getElementById("preview").innerHTML = "<p style='color:red;'>Gagal mengonversi file.</p>";
            console.error(err);
          });
      };

      reader.readAsArrayBuffer(file);
    });

    // Fungsi untuk ubah teks menjadi format soal interaktif
    function formatQuestions(html) {
      const lines = html.split(/<p>|<\/p>/).map(line => line.trim()).filter(l => l.length > 0);
      let output = "";
      let currentQuestion = "";
      let options = [];
      let questionNumber = 0;

      lines.forEach(line => {
        // Deteksi nomor soal (misal: "1. ..." atau "2. ...")
        if (/^\d+\./.test(line)) {
          // Jika ada soal sebelumnya, render dulu
          if (currentQuestion) {
            output += renderQuestion(currentQuestion, options, questionNumber);
            options = [];
          }
          currentQuestion = line.replace(/^\d+\.\s*/, "");
          questionNumber++;
        } 
        // Deteksi opsi A–D
        else if (/^[A-Da-d]\./.test(line)) {
          options.push(line.replace(/^[A-Da-d]\.\s*/, ""));
        }
      });

      // Render soal terakhir
      if (currentQuestion) {
        output += renderQuestion(currentQuestion, options, questionNumber);
      }

      return output;
    }

    function renderQuestion(question, options, number) {
      let html = `<div class="question"><strong>${number}. ${question}</strong><br>`;
      options.forEach((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        html += `
          <label class="option">
            <input type="radio" name="q${number}" value="${letter}">
            ${letter}. ${opt}
          </label>`;
      });
      html += "</div>";
      return html;
    }
  </script>

</body>
</html>
