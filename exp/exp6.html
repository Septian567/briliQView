<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Form Soal Pilihan Jawaban</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0}
    body{background:#f6f8fb;color:#111;padding:24px;}
    .card{background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(20,30,60,0.06);padding:20px;max-width:820px;margin:18px auto}
    h1{font-size:20px;margin:0 0 12px}
    label{display:block;margin-top:10px;font-weight:600}
    textarea, input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid #d7dbe6;font-size:14px}
    .choices{margin-top:12px}
    .choice{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .choice input[type=text]{flex:1}
    button{cursor:pointer;padding:8px 12px;border-radius:8px;border:0;background:#2563eb;color:#fff;font-weight:600}
    .muted{color:#6b7280;font-weight:500;font-size:13px}
    .row{display:flex;gap:8px}
    .small{padding:6px 8px;font-size:13px}
    .danger{background:#ef4444}
    .result{margin-top:12px;padding:12px;border-radius:8px}
    .correct{background:#ecfdf5;color:#065f46;border:1px solid #bbf7d0}
    .incorrect{background:#fff1f2;color:#9f1239;border:1px solid #fecaca}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .note{font-size:13px;color:#374151;margin-top:8px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Form: Buat Soal Pilihan Jawaban</h1>
    <form id="soalForm">
      <label for="soal">Soal</label>
      <textarea id="soal" rows="3" placeholder="Tulis pertanyaan di sini...">Siapa penemu lampu pijar modern?</textarea>

      <div class="choices" id="choices">
        <label class="muted">Pilihan jawaban (pilih 1 sebagai jawaban benar)</label>
        <!-- pilihan akan diisi oleh JS -->
      </div>

      <div class="controls">
        <button type="button" id="addChoice" class="small">+ Tambah pilihan</button>
        <button type="button" id="resetChoices" class="small">Reset pilihan</button>
        <button type="submit" id="submitBtn" class="small">Submit jawaban</button>
      </div>

      <div class="note">Setelah membuat soal dan pilihan, gunakan area di bawah untuk memilih jawaban dan cek hasilnya.</div>

      <hr style="margin:16px 0;border:none;border-top:1px dashed #e6eef8">

      <h2 style="font-size:16px;margin:0 0 8px">Jawab soal</h2>
      <div id="displaySoal" class="muted">Soal akan muncul di sini</div>

      <div id="answerArea" style="margin-top:12px">
        <!-- area jawaban (pilihan radio) diisi oleh JS -->
      </div>

      <div style="margin-top:12px">
        <button type="button" id="checkBtn">Cek Jawaban</button>
      </div>

      <div id="result" class="result" style="display:none"></div>
    </form>
  </div>

  <script>
    // Contoh awal pilihan
    const initialChoices = [
      'Thomas Alva Edison',
      'Nikola Tesla',
      'Alexander Graham Bell',
      'Michael Faraday'
    ];

    const choicesContainer = document.getElementById('choices');
    const answerArea = document.getElementById('answerArea');
    const displaySoal = document.getElementById('displaySoal');
    const resultBox = document.getElementById('result');
    const soalInput = document.getElementById('soal');

    function createChoiceInput(value = '', checked = false) {
      const wrap = document.createElement('div');
      wrap.className = 'choice';

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'correct';

      const text = document.createElement('input');
      text.type = 'text';
      text.placeholder = 'Isi teks pilihan...';
      text.value = value;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'small danger';
      del.textContent = 'Hapus';
      del.onclick = () => { wrap.remove(); renderAnswerArea(); };

      wrap.appendChild(radio);
      wrap.appendChild(text);
      wrap.appendChild(del);

      return wrap;
    }

    function renderChoiceList(list = []){
      choicesContainer.innerHTML = '<label class="muted">Pilihan jawaban (pilih 1 sebagai jawaban benar)</label>';
      list.forEach(item => choicesContainer.appendChild(createChoiceInput(item)));
      renderAnswerArea();
    }

    function getChoiceTexts(){
      return Array.from(choicesContainer.querySelectorAll('.choice input[type=text]')).map(i => i.value.trim());
    }

    function renderAnswerArea(){
      displaySoal.textContent = soalInput.value || '—';
      const texts = getChoiceTexts();
      answerArea.innerHTML = '';
      if(texts.length === 0){
        answerArea.innerHTML = '<div class="muted">Belum ada pilihan. Tambah pilihan untuk menampilkan area jawaban.</div>';
        return;
      }
      const list = document.createElement('div');
      texts.forEach((t, idx) =>{
        const id = 'ans-'+idx;
        const label = document.createElement('label');
        label.style.display='block';
        label.style.marginBottom='8px';
        label.innerHTML = `<input type="radio" name="userAnswer" value="${idx}" id="${id}"> <span style="margin-left:8px">${t || '(kosong)'}</span>`;
        list.appendChild(label);
      });
      answerArea.appendChild(list);
    }

    // tombol tambah
    document.getElementById('addChoice').addEventListener('click', ()=>{
      choicesContainer.appendChild(createChoiceInput(''));
      renderAnswerArea();
    });

    document.getElementById('resetChoices').addEventListener('click', ()=>{
      renderChoiceList(initialChoices);
    });

    // inisialisasi
    renderChoiceList(initialChoices);

    // bila teks soal atau pilihan berubah, re-render area jawaban saat fokus keluar
    soalInput.addEventListener('input', renderAnswerArea);
    choicesContainer.addEventListener('input', renderAnswerArea);

    // submit form: jangan reload
    document.getElementById('soalForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      // Set jawaban benar berdasarkan radio yang dipilih di bagian pilihan (bukan userAnswer)
      const radios = choicesContainer.querySelectorAll('.choice input[type=radio]');
      const texts = getChoiceTexts();
      const correctIndex = Array.from(radios).findIndex(r => r.checked);
      if(correctIndex === -1){
        alert('Tandai jawaban benar terlebih dahulu (klik bulatan di samping pilihan yang benar).');
        return;
      }
      alert('Soal tersimpan. Sekarang pilih jawaban di bagian "Jawab soal" lalu klik "Cek Jawaban".');
    });

    // tombol cek jawaban
    document.getElementById('checkBtn').addEventListener('click', ()=>{
      const user = answerArea.querySelector('input[name=userAnswer]:checked');
      if(!user){ alert('Pilih salah satu jawaban dulu.'); return; }
      const userIdx = Number(user.value);

      const radios = choicesContainer.querySelectorAll('.choice input[type=radio]');
      const correctIndex = Array.from(radios).findIndex(r => r.checked);
      const texts = getChoiceTexts();

      if(correctIndex === -1){
        alert('Belum ada jawaban benar yang ditandai di bagian pembuatan soal.');
        return;
      }

      if(userIdx === correctIndex){
        resultBox.style.display = 'block';
        resultBox.className = 'result correct';
        resultBox.textContent = 'Benar! ✔ — Jawaban Anda sesuai.';
      } else {
        resultBox.style.display = 'block';
        resultBox.className = 'result incorrect';
        resultBox.innerHTML = 'Salah ✖ — Jawaban benar: <strong>' + (texts[correctIndex] || '(kosong)') + '</strong>';
      }
    });

    // keyboard: Enter pada input teks tidak submit form secara tidak sengaja
    choicesContainer.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter') e.preventDefault();
    });

    // hint: klik satu radio pada daftar pilihan untuk menandai jawaban yang benar
    // (radio di samping setiap pilihan)
  </script>
</body>
</html>
