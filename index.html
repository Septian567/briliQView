<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Ujian - Upload CSV</title>
  <style>
    /* 🌐 RESET & GLOBAL */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f2f4f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 🧱 HEADER */
    h2 {
      margin-bottom: 15px;
      text-align: center;
      color: #222;
    }

    /* 📂 INPUT UPLOAD */
    #fileInput {
      display: block;
      margin: 10px auto 25px auto;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    /* 🧩 CARD SOAL */
    .card {
      background: white;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      margin-bottom: 25px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #333;
      line-height: 1.4;
    }

    /* 🎯 TOMBOL PILIHAN */
    .options button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      background: #f1f3f5;
      cursor: pointer;
      transition: 0.2s;
    }

    .options button:hover {
      background: #e9ecef;
    }

    .options button:active {
      background: #dee2e6;
    }

    /* 🏁 HASIL */
    #result {
      text-align: center;
      font-weight: bold;
      font-size: 1.3rem;
      color: #16a34a;
      margin-top: 15px;
    }

    /* 📱 RESPONSIVE */
    @media (max-width: 480px) {
      .card { padding: 15px; }
      .question { font-size: 1rem; }
      .options button { font-size: 0.95rem; padding: 12px; }
    }

  </style>
</head>
<body>
  <h2>📘 Simulasi Ujian</h2>
  <input type="file" id="fileInput" accept=".csv">
  <div id="quizContainer"></div>
  <script src="script.js"></script>
</body>
</html>
